[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-workbench"
version = "2.0.0"
description = "Strategy research terminal with reproducible analytics and evidence-grounded agents"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph==0.2.76", "openai==2.38.0",
  "pandas==2.3.3", "numpy==2.4.1", "plotly==6.5.2",
  "pydantic==2.13.4", "httpx==0.28.1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

