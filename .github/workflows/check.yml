name: Research acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest tests --junitxml outputs/test-results.xml
      - run: python -m research_agent.cli evaluate
      - run: python scripts/verify_strategy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-acceptance-${{ matrix.os }}
          path: |
            outputs/test-results.xml
            outputs/evaluation/evaluation.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
